name: Valorant News

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão

permissions:
  contents: write             # precisa para commitar o sent.json

concurrency:
  group: valorant-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar e enviar notícias
        run: python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AVATAR_URL: ${{ vars.AVATAR_URL }}

      - name: Salvar notícias enviadas
        if: always()
        run: |
          [ -f sent.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "chore: atualiza notícias enviadas" && git push)
